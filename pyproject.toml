[project]
name = "hemonc-alchemy"
dynamic = ["version"]
description = "SQLAlchemy-based models, regeneration tooling, and utilities for the HemOnc.org oncology terminology"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Georgie Kennedy", email = "georgina.kennedy@unsw.edu.au" }
]
license = { text = "CC-BY-NC-SA-4.0" }

keywords = [
  "HemOnc",
  "oncology",
  "clinical-data",
  "health-informatics",
  "sqlalchemy",
  "ETL",
  "real-world-evidence"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "sqlalchemy>=2.0.45",
  "pandas>=2.0",
  "oa-configurator>=1.1.0,<2.0.0",
  "orm-loader>=1.0.0,<2.0.0",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2",
]
author = [
  "linkml>=1.9.6",
  "linkml-runtime>=1.9.5",
  "openpyxl>=3.1.5",
  "pyyaml>=6.0",
]
dev = [
  "oa-configurator[dev,postgres]>=1.1.0,<2.0.0",
  "hemonc-alchemy[author,postgres]",
  "ipython>=8.0",
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "mypy>=1.8",
  "import-linter>=2.0",
  "mkdocs-material>=9.7.1",
  "mkdocstrings-python>=2.0.1",
  "mkdocs>=1.6.1",
  "mkdocs-mermaid2-plugin",
]

[project.urls]
Homepage = "https://github.com/AustralianCancerDataNetwork/HemOnc_Alchemy"
Repository = "https://github.com/AustralianCancerDataNetwork/HemOnc_Alchemy"
Issues = "https://github.com/AustralianCancerDataNetwork/HemOnc_Alchemy/issues"

[project.scripts]
hemonc-alchemy = "hemonc_alchemy.cli:main"

[project.entry-points."omop.config"]
hemonc_alchemy = "hemonc_alchemy.config:HemOncAlchemyConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { tag_regex = '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$' }

[tool.hatch.build.targets.wheel]
packages = ["hemonc_alchemy"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.uv.sources]
# TEMPORARY: points at the `register_cast_rule` branch on GitHub (not yet
# released), which adds register_column_cast_rule() -- see
# https://github.com/AustralianCancerDataNetwork/orm-loader/issues/36 -- plus
# the header-quoting and required-column fixes from earlier work on this
# same dependency. Revert this to the plain PyPI `orm-loader>=1.0.0,<2.0.0`
# dependency (already declared above) once a real release with these lands.
orm-loader = { git = "https://github.com/AustralianCancerDataNetwork/orm-loader", branch = "register_cast_rule" }

[tool.ruff]
extend-exclude = ["hemonc_alchemy/model/entities.py", "hemonc_alchemy/model/enums.py", "reference/"]

[tool.pytest.ini_options]
markers = [
  "postgres: requires a running docker-compose Postgres instance",
]
